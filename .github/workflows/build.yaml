name: Build go project

on:
    push

jobs:
    create_env:
        runs_on: ubuntu-latest
        steps:
            - name: Checkout the repo
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-go@v7
              with:
                go-version: '1.25' # The Go version to download (if necessary) and use.
        - run: go run main.go